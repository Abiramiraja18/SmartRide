<!DOCTYPE html>
<html>
<head>
    <title>SmartBus - Register</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            height:100vh;
            background:linear-gradient(rgba(14,42,71,0.95), rgba(14,42,71,0.95)),
            url('https://images.unsplash.com/photo-1570125909232-eb263c188f7e');
            background-size:cover;
            background-position:center;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .register-container{
            background:white;
            width:370px;
            padding:35px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
        }

        .register-container h2{
            text-align:center;
            margin-bottom:10px;
            color:#0e2a47;
        }

        .register-container p{
            text-align:center;
            margin-bottom:20px;
            color:#555;
            font-size:14px;
        }

        .input-group{
            margin-bottom:15px;
        }

        .input-group input,
        .input-group select{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            outline:none;
            font-size:14px;
        }

        .btn{
            width:100%;
            padding:12px;
            background:#1cc5b7;
            border:none;
            border-radius:8px;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        .btn:hover{
            background:#16a89b;
        }

        .links{
            margin-top:15px;
            text-align:center;
            font-size:14px;
        }

        .links a{
            color:#1cc5b7;
            text-decoration:none;
            cursor:pointer;
        }
    </style>
</head>

<body>

<div class="register-container">

    <h2><i class="fa-solid fa-user-plus"></i> Register</h2>
    <p>Create your SmartBus account</p>

    <div class="input-group">
        <input type="text" id="username" placeholder="Username">
    </div>

    <div class="input-group">
        <input type="email" id="email" placeholder="Email">
    </div>

    <div class="input-group">
        <input type="text" id="mobile" placeholder="Mobile Number">
    </div>

    <div class="input-group">
        <input type="number" id="age" placeholder="Age">
    </div>

    <div class="input-group">
        <select id="gender">
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>
    </div>

    <div class="input-group">
        <input type="password" id="password" placeholder="Password">
    </div>

    <button class="btn" onclick="registerUser()">Register</button>

    <div class="links">
        Already have an account?
        <a onclick="goLogin()">Login</a>
    </div>

</div>

<script>

function registerUser(){

    let username = document.getElementById("username").value;
    let email = document.getElementById("email").value;
    let mobile = document.getElementById("mobile").value;
    let age = document.getElementById("age").value;
    let gender = document.getElementById("gender").value;
    let password = document.getElementById("password").value;

    if(username === "" || email === "" || mobile === "" || age === "" || gender === "" || password === ""){
        alert("Please fill all fields");
        return;
    }

    let userData = {
        username,
        email,
        mobile,
        age,
        gender,
        password
    };

    localStorage.setItem("smartbusUser", JSON.stringify(userData));

    alert("Registration Successful");

    window.location.href = "login.html";
}

function goLogin(){
    window.location.href = "login.html";
}

</script>

</body>
</html>
